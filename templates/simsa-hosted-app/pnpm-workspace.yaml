packages:
  - "."
# 의존성 빌드 스크립트(preinstall·install·postinstall) 허용 목록 — pnpm ≥10.26 `allowBuilds`(pnpm 11은 이것만 읽는다).
# esbuild·workerd만 true(네이티브 바이너리 확인). 목록에 없는 패키지의 스크립트는 실행하지 않는다.
# 종전 파일의 두 값은 pnpm이 써 둔 "미결정" 자리 표시자 문자열(true·false가 아님)이었다 — pnpm 10.34.5 실측:
# onlyBuiltDependencies가 없으면 두 패키지 모두 "Ignored build scripts"로 건너뛴다(2026-10-01, 빌드 잡 B-5b-3 전 정정).
allowBuilds:
  esbuild: true
  workerd: true
