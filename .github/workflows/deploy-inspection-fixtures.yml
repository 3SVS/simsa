# deploy-inspection-fixtures — 검수 정확도 실측용 픽스처 앱(tools/simsa-inspection-fixtures, Worker
# `simsa-inspection-fixtures`)의 배포 경로. 정적 Worker · 바인딩·비밀 없음(wrangler.toml).
#
# 다른 배포와 같은 규율: 수동(workflow_dispatch)만 · main에서만 · confirm 입력에 정확히 "deploy".
# 승인 문구: `deploy simsa-inspection-fixtures approved.` (Bae) — 1회 실행분만.
# 시크릿: central-plane 배포와 같은 CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID 재사용(새 시크릿 없음).
# 배포 뒤 C-A7 의도 불일치 픽스처 경로가 실제로 응답하는지 확인한다(정답지 실측의 전제).
name: deploy-inspection-fixtures

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a deploy of the inspection fixture apps'
        required: true
        default: ''

concurrency:
  group: deploy-inspection-fixtures
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::deploy-inspection-fixtures must run on 'main', got ${{ github.ref }}"
          exit 1
      - name: Confirm deploy intent
        if: inputs.confirm != 'deploy'
        run: |
          echo "Refusing to deploy: the 'confirm' input must be exactly 'deploy'."
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Deploy Worker
        working-directory: tools/simsa-inspection-fixtures
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Verify fixtures respond
        run: |
          set -u
          base="https://simsa-inspection-fixtures.seunghunbae.workers.dev"
          # intent-mismatch/* = C-A7 새 경로(이 배포의 목적) — 옛 배포에는 없다.
          for p in working-todo potemkin-crm intent-mismatch/booking-no-date; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 20 "$base/$p")
            echo "$p → $code"; [ "$code" = "200" ] || exit 1
          done
