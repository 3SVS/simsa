# SI 티어 Train B — B2: S 모드 호스팅 라우터 (D-6 · D-12).
#
# <slug>.<HOSTING_ROOT_DOMAIN> 으로 들어온 요청을 Workers for Platforms dispatch namespace
# `simsa-hosted` 안의 유저 Worker(스크립트 이름 = slug)로 보낸다. 유저 앱의 코드는 우리
# 계정에서, 테넌트별로 격리되어 돈다. 유저 배포 토큰은 어디에도 없다.
#
# 결정(2026-09-25): 도메인 simsa.page · WfP Paid 구독 완료(Bae).
# 배포 순서: 네임스페이스 simsa-hosted 생성 → `*` 와일드카드 DNS → deploy.
# B-7(2026-09-30): 배포는 Actions → deploy-hosting-dispatch(main·confirm "deploy")로만. 로컬 wrangler 금지.
#   배포 SHA는 워크플로가 `--var DEPLOYED_SHA:$GITHUB_SHA`로 넣는다(이 파일에 적지 않는다) →
#   `https://status.simsa.page/.well-known/simsa-health`의 sha·응답 헤더 x-simsa-dispatch-sha로 확인.
name = "simsa-hosting-dispatch"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# 예: "simsa.app" — 비어 있으면 모든 요청에 503 hosting_not_configured(정직하게 꺼짐).
HOSTING_ROOT_DOMAIN = "simsa.page"
# B-7: report.simsa.page 신고 폼이 보내는 central-plane(https만). 비우면 신고 페이지가 503 "지금은 받을 수 없어요".
SIMSA_API_BASE = "https://conclave-ai.seunghunbae.workers.dev"
# B-7: 신고 접수 스위치 — 정확히 "on"일 때만 신고 폼을 보인다. 개인정보처리방침에 '앱 신고' 수집 항목(연락처·
# 설명·신고자 키·보유 180일)을 고지한 **뒤에** central-plane의 같은 변수와 함께 "on"으로 바꾼다(PR·배포).
HOSTING_REPORTS_ENABLED = "off"

[[dispatch_namespaces]]
binding = "DISPATCHER"
namespace = "simsa-hosted"

# B-7 [PILOT] slug당 요청 상한 — Workers Rate Limiting 바인딩 두 겹(외부 리소스 생성 없음, namespace_id는 계정 안에서
# 고른 고유 정수). 수치는 src/route.ts HOSTING_RATE_LIMITS와 같아야 한다(테스트가 대조). period는 10 또는 60만.
# 카운터는 Cloudflare 지역(데이터센터)별·근사치다 — 전 세계 정확 합계가 아니다. 넘으면 429만 — 정지로 이어지지 않는다.
# 문서(페이지) 요청: 방문자 수에 가까운 값.
[[ratelimits]]
name = "HOSTING_PAGE_RATE_LIMITER"
namespace_id = "7301"
simple = { limit = 600, period = 60 }

# 모든 요청(이미지·스크립트·API 포함): 문서 판정을 헤더로 피하는 우회를 막는 백스톱.
[[ratelimits]]
name = "HOSTING_REQUEST_RATE_LIMITER"
namespace_id = "7302"
simple = { limit = 6000, period = 60 }

# B-7 정지 목록(Workers KV) — **central-plane wrangler.toml과 같은 id**를 적어야 한다(central-plane이 suspended:를
# 쓰고 이 라우터가 읽는다 · 이 라우터가 strike:를 쓰고 central-plane 크론이 읽어 운영자에게 알린다).
# 아직 네임스페이스가 없어 주석으로 둔다(가짜 id를 넣으면 배포가 실패한다). 없으면 라우터는 정지 확인 없이
# 서빙하고(fail-open, 근거는 src/index.ts 헤더) 헬스에 suspensionList "unbound"로 드러난다.
# 켜는 법(Bae 액션): Cloudflare 대시보드 → Storage & Databases → KV → Create → 이름 `simsa-hosting-suspended`
#   → 생성된 ID를 아래와 central-plane 양쪽에 적고 주석 해제 → PR·머지 → 두 Worker 배포.
# [[kv_namespaces]]
# binding = "HOSTING_SUSPENDED"
# id = "<simsa-hosting-suspended KV ID>"

# 2026-09-25 Bae 결정: 호스팅 도메인 = simsa.page (Cloudflare Registrar 구매, 같은 계정 활성 존).
# 대시보드 trysimsa.com·랜딩 simsa.dev와 등록 도메인이 달라 쿠키·평판이 격리된다(github.io·vercel.app 방식).
# .page는 HSTS preload TLD — HTTPS 강제. 전제: `*` 와일드카드 proxied DNS 레코드(배포 단계에서 추가).
# 검수 메일 수신(PROBE_MAIL_DOMAIN)은 conclave-ai.dev 그대로 — 호스팅 도메인과 분리.
[[routes]]
pattern = "*.simsa.page/*"
zone_name = "simsa.page"
